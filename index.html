<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='8' width='4' height='4' fill='%23a349cf'/><rect x='6' y='8' width='4' height='4' fill='%23a349cf'/><rect x='11' y='8' width='4' height='4' fill='%23a349cf'/><rect x='6' y='3' width='4' height='4' fill='%23a349cf'/></svg>" />
    <title>Tetracer</title>
  </head>
  <body>
    <header>
      <div class="source">
        <label class="file">
          <input type="file" id="file" accept=".json,.gz" multiple />
          <span>Load replay</span>
        </label>
        <span class="or">or</span>
        <select id="preset" title="Runs that ship with the trainer"></select>
      </div>
      <button id="config" type="button">Settings</button>
      <!-- biome-ignore lint/a11y/useAnchorContent: the label is on the anchor, the icon inside it
           hidden from the reader, which is the way round an icon link is meant to be -->
      <a
        id="source"
        hidden
        href="https://github.com/lincot/tetracer"
        rel="noreferrer"
        aria-label="Source on GitHub"
        title="Source on GitHub"
      >
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />
        </svg>
      </a>
    </header>
    <main>
      <aside>
        <select id="round" title="Player / round"></select>
        <p id="run"></p>
        <p id="altitude"></p>
        <p id="mods" title="Tower modifiers this run was played with"></p>
        <div id="segments"></div>
      </aside>
      <div id="stage">
        <canvas id="board" hidden></canvas>
        <p id="status"></p>
        <div id="guide">
          <h3>To load any tetr.io replay</h3>
          <ol>
            <li>
              Install <a href="https://violentmonkey.github.io/">Violentmonkey</a>, then
              <a href="tetrio-dump.user.js">add the capture script</a>.
            </li>
            <li>Open a replay on tetr.io and press <b>SAVE REPLAY</b>, beside EXIT.</li>
            <li>Load the file it writes, with the button above.</li>
          </ol>
        </div>
        <div id="level">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <path fill="currentColor" d="M7.5 2.5 4.5 5.5H2v5h2.5l3 3z" />
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
              d="M10 6a3.5 3.5 0 0 1 0 4M12.2 3.8a6.8 6.8 0 0 1 0 8.4"
            />
          </svg>
          <span></span>
        </div>
      </div>
      <div id="tools">
        <button class="tab" type="button">Difficulty</button>
        <div class="panel">
          <label title="Outline the target placement while you play">
            <input type="checkbox" id="ghosts" /> hints
          </label>
          <label title="Fail a placement that took more inputs than it needed">
            <input type="checkbox" id="finesse" /> finesse
          </label>
          <label title="Off, a piece hangs where it is until you take it down yourself">
            <input type="checkbox" id="gravity" /> gravity
          </label>
          <label class="cap" title="Longest run of pieces an interval may hold">
            max pieces <input type="number" id="cap" min="1" max="40" step="1" />
          </label>
          <label title="Fail a turn whose pieces come slower than this, counted from the first one landed; 0 asks nothing">
            min PPS <input type="number" id="pace" min="0" max="5" step="0.1" />
          </label>
          <label title="How fast the demo lays pieces down">
            demo PPS <input type="number" id="demo" min="0.5" max="8" step="0.1" />
          </label>
        </div>
      </div>
    </main>
    <p id="keys" hidden></p>
    <dialog id="settings"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
